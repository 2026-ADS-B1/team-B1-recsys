serving:
  min_ratings: 50
  moods:
    relaxed:
    - Comedy
    - Animation
    - Children's
    - Musical
    adventurous:
    - Action
    - Adventure
    - Sci-Fi
    - Fantasy
    - Western
    romantic:
    - Romance
    thrilling:
    - Thriller
    - Crime
    - Mystery
    - Film-Noir
    scary:
    - Horror
    thoughtful:
    - Drama
    - Documentary
    - War
app:
  service_url: http://127.0.0.1:8000
tracking:
  uri: https://dagshub.com/e26-kairi/team-B1-recsys.mlflow
  experiment: recommender
models:
  split:
    val_size: 0.1
    test_size: 0.1
    random_state: 42
    stratified_by_user: true
    min_user_ratings: 5
    temporal: true
  evaluation:
    k: 10
    threshold: 4.0
  baselines:
    popularity:
      min_ratings: 50
  svd:
    n_factors: 20
    learning_rate: 0.008
    reg: 0.05
    epochs: 40
    random_state: 42
    early_stopping: true
    patience: 5
tuning:
  svd:
    epochs: 35
    patience: 4
    trials:
    - n_factors: 10
      learning_rate: 0.002
      reg: 0.01
    - n_factors: 10
      learning_rate: 0.005
      reg: 0.02
    - n_factors: 20
      learning_rate: 0.005
      reg: 0.02
    - n_factors: 20
      learning_rate: 0.008
      reg: 0.05
    - n_factors: 30
      learning_rate: 0.005
      reg: 0.02
    - n_factors: 30
      learning_rate: 0.008
      reg: 0.05
