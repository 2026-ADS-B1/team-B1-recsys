# Settings shared by the project. Change them here, not in the code.

serving:
  # Minimum number of ratings a movie needs to be recommended.
  # Avoids that a movie with a single 5-star rating tops the list (see US1.1).
  min_ratings: 50

  # Moods a user can choose in POST /recommend, and the genres linked to each one.
  # A movie matches a mood if it has at least one of its genres.
  # Genre names must be written exactly as in MovieLens (see GET /genres).
  moods:
    relaxed: [Comedy, Animation, Children's, Musical]
    adventurous: [Action, Adventure, Sci-Fi, Fantasy, Western]
    romantic: [Romance]
    thrilling: [Thriller, Crime, Mystery, Film-Noir]
    scary: [Horror]
    thoughtful: [Drama, Documentary, War]

app:
  # Address of the recommendation service (POST /recommend).
  # Can be overridden with the SERVICE_URL environment variable.
  service_url: "http://127.0.0.1:8000"

models:
  # Split settings for training and fair evaluation (US2.2 AC4 & AC6)
  split:
    test_size: 0.2
    random_state: 42
    stratified_by_user: true
    min_user_ratings: 5

  # Baseline reference models configuration (US2.2 AC1 & AC6)
  baselines:
    popularity:
      min_ratings: 50

  # Advanced Matrix Factorization / SVD model configuration (US2.2 AC2 & AC6)
  svd:
    n_factors: 20
    learning_rate: 0.005
    reg: 0.02
    epochs: 15
    random_state: 42

